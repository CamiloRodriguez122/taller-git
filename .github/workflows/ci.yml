name: CI basica

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Verificar archivos obligatorios
        run: |
          test -f index.html
          echo "Estructura del proyecto correcta"